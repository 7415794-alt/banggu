<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>방구 피하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#bfe6ff;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
    box-shadow:0 0 40px rgba(0,0,0,.15)}
  #stage{position:relative;flex:1;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:calc(10px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.85);color:#3a3a5a;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
  #score{left:10px}
  #time{right:10px}
  #lives{left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:2px}
  #level{left:10px;top:calc(54px + env(safe-area-inset-top));font-size:16px;padding:3px 12px;color:#fff;background:#ff8a3d}
  #level.up{animation:bump .6s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  #controls{display:flex;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#5fae55}
  .btn{flex:1;height:84px;border:none;border-radius:20px;background:#fff;color:#ff5c9a;font-size:40px;
    font-family:inherit;box-shadow:0 6px 0 #d9d9e8;touch-action:none;cursor:pointer}
  .btn.on{transform:translateY(4px);box-shadow:0 2px 0 #d9d9e8;background:#ffe3ef}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(40,50,90,.45);z-index:5;padding:16px}
  .overlay.hide{display:none}
  .card{background:#fff;border-radius:24px;padding:26px 24px;text-align:center;width:100%;max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);color:#3a3a5a}
  .card h1{font-size:34px;color:#ff5c9a;margin-bottom:10px;font-weight:normal}
  .card p{font-size:17px;line-height:1.6;margin-bottom:6px}
  .card .big{font-size:24px;color:#3a3a5a}
  .card .big b{color:#ff5c9a;font-weight:normal}
  .card .sub{font-size:15px;color:#8a8aa8}
  .card button{margin-top:16px;border:none;border-radius:999px;background:#ff5c9a;color:#fff;
    font-family:inherit;font-size:22px;padding:12px 34px;box-shadow:0 5px 0 #d63f7c;cursor:pointer}
  .card button:active{transform:translateY(3px);box-shadow:0 2px 0 #d63f7c}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="score">점수 0</div>
    <div class="hud" id="level">Lv.1</div>
    <div class="hud" id="lives">❤️❤️❤️</div>
    <div class="hud" id="time">⏱ 00:00</div>

    <div class="overlay" id="startOv">
      <div class="card">
        <h1>방구 피하기</h1>
        <p>하늘의 <b style="color:#c0392b;font-weight:normal">창현</b>이가 뀌는 방구를<br>
           <b style="color:#ff5c9a;font-weight:normal">진경</b>이가 피해야 해요!</p>
        <p class="sub">◀ ▶ 버튼(또는 방향키)으로 이동<br>목숨은 3개, 피할 때마다 +1점<br>15초마다 레벨 UP! 점점 어려워져요</p>
        <button id="startBtn">시작하기</button>
      </div>
    </div>

    <div class="overlay hide" id="overOv">
      <div class="card">
        <h1>게임 종료</h1>
        <p class="big">점수 <b id="finalScore">0</b>점</p>
        <p class="big">플레이 시간 <b id="finalTime">00:00</b></p>
        <p class="big">도달 레벨 <b id="finalLevel">1</b></p>
        <p class="sub" id="bestLine"></p>
        <button id="restartBtn">다시 시작</button>
      </div>
    </div>
  </div>
  <div id="controls">
    <button class="btn" id="leftBtn" aria-label="왼쪽">◀</button>
    <button class="btn" id="rightBtn" aria-label="오른쪽">▶</button>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $time = document.getElementById('time');
  const $lives = document.getElementById('lives');
  const startOv = document.getElementById('startOv');
  const overOv = document.getElementById('overOv');

  let W = 0, H = 0, S = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.65, Math.min(1.4, Math.min(W / 400, H / 640)));
    if (player) {
      player.y = groundTop() + 6 * S;
      player.x = clamp(player.x, 26 * S, W - 26 * S);
      bandit.y = banditY();
      bandit.x = clamp(bandit.x, 50 * S, W - 50 * S);
    }
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const groundTop = () => H - 34 * S;
  const banditY = () => 70 + 40 * S;
  const fmt = sec => {
    const s = Math.floor(sec);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };

  // ---------- 상태 ----------
  let state = 'ready';
  let player, bandit, puffs, pops, sparks, score, lives, elapsed, invuln, spawnT, shake, level, banner;
  const $level = document.getElementById('level');
  const LEVEL_SEC = 15;

  // 레벨별 난이도 (레벨이 오를수록 점점 어려워짐)
  function diff(lv) {
    const n = lv - 1;
    return {
      speed: Math.min(640, 165 + n * 42),                 // 떨어지는 속도
      interval: Math.max(0.28, 1.3 * Math.pow(0.87, n)),  // 방구 간격(초)
      double: lv >= 3 ? Math.min(0.6, (lv - 2) * 0.13) : 0,   // 2개 동시 확률
      triple: lv >= 6 ? Math.min(0.4, (lv - 5) * 0.09) : 0,   // 3개 동시 확률
      drift: lv >= 4 ? Math.min(110, (lv - 3) * 18) : 10,     // 옆으로 흘러가는 정도
      zigzag: lv >= 5 ? Math.min(0.6, (lv - 4) * 0.12) : 0,   // 지그재그 방구 확률
      big: lv >= 7 ? Math.min(0.35, (lv - 6) * 0.08) : 0,     // 왕방구 확률
      move: Math.min(7, 2.4 + n * 0.45),                  // 창현 이동 속도
    };
  }
  const deco = [];

  function reset() {
    player = { x: W / 2, y: groundTop() + 6 * S, dir: 0, face: 1 };
    bandit = { x: W / 2, y: banditY(), tx: W / 2, vx: 0, timer: 1, squish: 0 };
    puffs = []; pops = []; sparks = [];
    score = 0; lives = 3; elapsed = 0; invuln = 0; spawnT = 1.0; shake = 0; level = 1; banner = null;
    // 테스트용: 주소 끝에 #lv=5 를 붙이면 5레벨부터 시작
    const m = location.hash.match(/lv=(\d+)/);
    if (m) { level = Math.max(1, +m[1]); elapsed = (level - 1) * LEVEL_SEC; }
    updateHud();
  }

  function updateHud() {
    $score.textContent = '점수 ' + score;
    $level.textContent = 'Lv.' + level;
    $time.textContent = '⏱ ' + fmt(elapsed);
    $lives.textContent = '❤️'.repeat(lives) + '🤍'.repeat(3 - lives);
  }

  function initDeco() {
    deco.length = 0;
    for (let i = 0; i < 5; i++) deco.push({ x: rand(0, W), y: rand(H * 0.25, H * 0.7), s: rand(0.6, 1.2), v: rand(6, 16) });
  }

  // ---------- 입력 ----------
  const keys = { left: false, right: false };
  const held = { left: new Set(), right: new Set() };
  function bindBtn(el, side) {
    const on = e => { e.preventDefault(); held[side].add(e.pointerId); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = e => { held[side].delete(e.pointerId); if (!held[side].size) el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindBtn(document.getElementById('leftBtn'), 'left');
  bindBtn(document.getElementById('rightBtn'), 'right');

  // 화면 좌/우 절반 터치로도 이동
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const side = (e.clientX - r.left) < r.width / 2 ? 'left' : 'right';
    held[side].add(e.pointerId);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const cvOff = e => { held.left.delete(e.pointerId); held.right.delete(e.pointerId); };
  cv.addEventListener('pointerup', cvOff);
  cv.addEventListener('pointercancel', cvOff);

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; held.left.clear(); held.right.clear(); });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', start);

  function start() {
    reset();
    state = 'play';
    startOv.classList.add('hide');
    overOv.classList.add('hide');
  }

  function gameOver() {
    state = 'over';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalTime').textContent = fmt(elapsed);
    document.getElementById('finalLevel').textContent = 'Lv.' + level;
    let best = 0;
    try { best = +localStorage.getItem('bangguBest') || 0; if (score > best) { best = score; localStorage.setItem('bangguBest', best); } } catch (_) { best = Math.max(best, score); }
    document.getElementById('bestLine').textContent = '최고 점수 ' + best + '점';
    setTimeout(() => overOv.classList.remove('hide'), 450);
  }

  // ---------- 그리기 도우미 ----------
  function el(x, y, rx, ry, fill, rot = 0) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  function drawCloud(x, y, s, alpha = 0.9) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 20 * s, y - 8 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 42 * s, y, 17 * s, 0, Math.PI * 2);
    ctx.rect(x, y, 42 * s, 17 * s);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#7cc6f5'); g.addColorStop(1, '#e3f5ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const c of deco) drawCloud(c.x, c.y, c.s * S, 0.7);
    // 잔디
    const gy = groundTop();
    ctx.fillStyle = '#7fd36f'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#69bf5b'; ctx.fillRect(0, gy, W, 5 * S);
    for (let i = 0; i < W; i += 46 * S) {
      const fx = i + 18 * S, fy = gy + 18 * S;
      el(fx, fy, 3 * S, 3 * S, i % 3 < 1 ? '#fff4a3' : '#ffd1e3');
    }
  }

  // ---------- 창현 (안경 쓴 수염 산적) ----------
  const SKIN = '#f3c48c';
  function drawBandit(b, t) {
    ctx.save();
    ctx.translate(b.x, b.y + Math.sin(t * 2.2) * 4 * S);
    ctx.rotate(clamp(b.vx / (1600 * S), -0.18, 0.18));
    const sq = b.squish;
    ctx.scale(S * (1 + sq * 0.12), S * (1 - sq * 0.12));
    ctx.lineCap = 'round';

    // 다리
    const sw = Math.sin(t * 4) * 4;
    ctx.strokeStyle = '#4a3b2a'; ctx.lineWidth = 10;
    line(-10, 55, -12 + sw, 73); line(10, 55, 12 - sw, 73);
    el(-14 + sw, 77, 9, 5, '#2b2b2b'); el(14 - sw, 77, 9, 5, '#2b2b2b');

    // 팔
    const aw = Math.sin(t * 3) * 6;
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 9;
    line(-22, 30, -42, 16 + aw); line(22, 30, 42, 16 - aw);
    el(-44, 14 + aw, 6, 6, SKIN); el(44, 14 - aw, 6, 6, SKIN);

    // 몸통 + 조끼
    el(0, 40, 27, 24, '#c0392b');
    ctx.fillStyle = '#6b4226';
    ctx.beginPath(); ctx.moveTo(-25, 28); ctx.quadraticCurveTo(-31, 50, -18, 62); ctx.lineTo(-6, 63); ctx.lineTo(-5, 20); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(25, 28); ctx.quadraticCurveTo(31, 50, 18, 62); ctx.lineTo(6, 63); ctx.lineTo(5, 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.fillRect(-26, 50, 52, 7);
    ctx.strokeStyle = '#f4c542'; ctx.lineWidth = 2.5; ctx.strokeRect(-5, 48.5, 10, 10);

    // 머리
    el(-27, 4, 5, 7, SKIN); el(27, 4, 5, 7, SKIN);
    el(0, 0, 28, 28, SKIN);

    // 수염(턱수염)
    ctx.fillStyle = '#3b2414';
    ctx.beginPath();
    ctx.moveTo(-28, 0);
    ctx.quadraticCurveTo(-31, 30, -13, 40);
    ctx.quadraticCurveTo(0, 50, 13, 40);
    ctx.quadraticCurveTo(31, 30, 28, 0);
    ctx.quadraticCurveTo(20, 14, 10, 12);
    ctx.quadraticCurveTo(0, 10, -10, 12);
    ctx.quadraticCurveTo(-20, 14, -28, 0);
    ctx.fill();
    for (let i = -2; i <= 2; i++) el(i * 8, 40 + (2 - Math.abs(i)) * 2, 6, 6, '#3b2414');

    // 입 (방구 뀔 때 '휴~' 동그랗게)
    el(0, 22, sq > 0.3 ? 4 : 6, sq > 0.3 ? 4.5 : 2.6, '#9b4a4a');
    // 콧수염
    el(-9, 14, 11, 4.5, '#2a180c', -0.25); el(9, 14, 11, 4.5, '#2a180c', 0.25);
    // 코
    el(0, 8, 5.5, 4.5, '#e2a465');

    // 두건
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(0, -2, 29.5, Math.PI, Math.PI * 2);
    ctx.quadraticCurveTo(0, -22, -29.5, -2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    [[-14, -18], [0, -24], [14, -18], [-20, -8], [20, -8]].forEach(([x, y]) => el(x, y, 2.2, 2.2, '#fff'));
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.moveTo(26, -12); ctx.lineTo(44, -4 + Math.sin(t * 6) * 3); ctx.lineTo(36, -10); ctx.lineTo(44, -20 + Math.sin(t * 6 + 1) * 3); ctx.closePath(); ctx.fill();
    el(27, -11, 5, 5, '#c0392b');

    // 눈썹
    ctx.strokeStyle = '#2a180c'; ctx.lineWidth = 4;
    line(-19, -12, -5, -10); line(19, -12, 5, -10);

    // 눈 (방구 뀔 때는 시원한 ^^ 표정)
    if (sq > 0.3) {
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-11, 0, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, 0, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else {
      el(-11, -1, 2.6, 2.8, '#222'); el(11, -1, 2.6, 2.8, '#222');
    }

    // 안경
    ctx.fillStyle = 'rgba(190,225,255,0.35)';
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-11, -1, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(11, -1, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    line(-2, -2, 2, -2); line(-20, -3, -27, -4); line(20, -3, 27, -4);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.6;
    line(-15, -5, -12, -8); line(7, -5, 10, -8);

    ctx.restore();
  }

  // ---------- 진경 (검은 긴머리 여성) ----------
  const SKIN2 = '#ffe1cf';
  const HAIR = '#151515';
  function drawGirl(p, t) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(S, S);
    if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.lineCap = 'round';
    const walk = p.dir ? Math.sin(t * 16) : 0;
    const sway = -p.dir * 6;
    const hurt = invuln > 0.6;

    // 뒷머리 (긴 생머리)
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-23, -86);
    ctx.quadraticCurveTo(-31, -56, -25 + sway, -30);
    ctx.quadraticCurveTo(sway, -24, 25 + sway, -30);
    ctx.quadraticCurveTo(31, -56, 23, -86);
    ctx.closePath(); ctx.fill();
    el(0, -82, 25, 26, HAIR);

    // 다리 + 신발
    ctx.strokeStyle = SKIN2; ctx.lineWidth = 6;
    line(-6, -22, -6 - walk * 3, -4); line(6, -22, 6 + walk * 3, -4);
    el(-7 - walk * 3, -2, 6.5, 3.6, '#e84a8a'); el(7 + walk * 3, -2, 6.5, 3.6, '#e84a8a');

    // 팔
    ctx.lineWidth = 5;
    line(-12, -52, -20, -31 + walk * 3); line(12, -52, 20, -31 - walk * 3);

    // 원피스
    ctx.fillStyle = '#ff6fa8';
    ctx.beginPath();
    ctx.moveTo(-12, -57); ctx.lineTo(12, -57); ctx.lineTo(23, -18);
    ctx.quadraticCurveTo(0, -14, -23, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-7, -57); ctx.lineTo(0, -50); ctx.lineTo(7, -57); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd1e3'; ctx.fillRect(-15, -42, 30, 4);

    // 목 + 얼굴
    ctx.fillStyle = SKIN2; ctx.fillRect(-3.5, -62, 7, 7);
    el(0, -78, 18, 20, SKIN2);

    // 앞머리
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-20, -78);
    ctx.quadraticCurveTo(-23, -105, 0, -104);
    ctx.quadraticCurveTo(23, -105, 20, -78);
    ctx.quadraticCurveTo(15, -90, 7, -87);
    ctx.quadraticCurveTo(0, -93, -6, -87);
    ctx.quadraticCurveTo(-15, -90, -20, -78);
    ctx.fill();
    ctx.strokeStyle = HAIR; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-19, -82); ctx.quadraticCurveTo(-22, -64, -19 + sway * 0.4, -50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, -82); ctx.quadraticCurveTo(22, -64, 19 + sway * 0.4, -50); ctx.stroke();

    // 머리핀
    el(-13, -95, 4.5, 3, '#ffcf3f', -0.4);

    // 눈
    if (hurt) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.8;
      line(-10, -79, -5, -76); line(-10, -73, -5, -76);
      line(10, -79, 5, -76); line(10, -73, 5, -76);
    } else {
      el(-7, -76, 2.8, 3.6, '#222'); el(7, -76, 2.8, 3.6, '#222');
      el(-6, -77.5, 1, 1.2, '#fff'); el(8, -77.5, 1, 1.2, '#fff');
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2;
      line(-9.5, -79, -11.5, -81); line(9.5, -79, 11.5, -81);
    }
    // 볼터치 + 입
    el(-11.5, -70, 3.6, 2.1, 'rgba(255,120,150,.55)');
    el(11.5, -70, 3.6, 2.1, 'rgba(255,120,150,.55)');
    ctx.strokeStyle = '#d9536f'; ctx.lineWidth = 1.6;
    if (hurt) { el(0, -68, 2.2, 2.6, '#d9536f'); }
    else { ctx.beginPath(); ctx.arc(0, -70, 3.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }

    ctx.restore();
  }

  function drawLabel(text, x, y, color) {
    ctx.save();
    ctx.font = `${Math.round(17 * S)}px Jua, 'Malgun Gothic', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4 * S; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
    ctx.restore();
  }

  // ---------- 방구 구름 (귀여운 몽글몽글) ----------
  function drawPuff(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const r = p.r;
    // 꼬리 잔상
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.28 / i;
      el(Math.sin(p.t * 5 + i) * r * 0.25, -r * (0.85 + i * 0.5), r * (0.42 - i * 0.07), r * (0.42 - i * 0.07), '#dff7d6');
    }
    ctx.globalAlpha = 1;
    ctx.rotate(Math.sin(p.t * 3 + p.ph) * 0.15);
    const k = 1 + Math.sin(p.t * 7 + p.ph) * 0.06;
    ctx.scale(k, 1 / k);
    const blobs = [[0, 0.05, 0.8], [-0.55, 0.2, 0.55], [0.55, 0.2, 0.55], [-0.25, -0.4, 0.5], [0.3, -0.38, 0.52]];
    ctx.fillStyle = '#86cf7d';
    for (const [bx, by, br] of blobs) { ctx.beginPath(); ctx.arc(bx * r, by * r, br * r + 2, 0, Math.PI * 2); ctx.fill(); }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e3f8d8'); g.addColorStop(1, '#b6e8a8');
    ctx.fillStyle = g;
    for (const [bx, by, br] of blobs) { ctx.beginPath(); ctx.arc(bx * r, by * r, br * r, 0, Math.PI * 2); ctx.fill(); }
    // 귀여운 얼굴
    el(-r * 0.22, r * 0.02, r * 0.07, r * 0.09, '#4d6b48');
    el(r * 0.22, r * 0.02, r * 0.07, r * 0.09, '#4d6b48');
    ctx.strokeStyle = '#4d6b48'; ctx.lineWidth = Math.max(1.2, r * 0.06); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, r * 0.14, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    el(-r * 0.4, r * 0.2, r * 0.1, r * 0.06, 'rgba(255,150,170,.6)');
    el(r * 0.4, r * 0.2, r * 0.1, r * 0.06, 'rgba(255,150,170,.6)');
    ctx.restore();
  }

  // ---------- 효과 ----------
  function addPop(x, y, text, color, size = 22) { pops.push({ x, y, text, color, size, t: 0, life: 0.9 }); }
  function addSparks(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 180) * S;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 * S, t: 0, life: rand(0.4, 0.8), r: rand(3, 6) * S, c: colors[i % colors.length] });
    }
  }

  // ---------- 방구 발사 ----------
  function fart() {
    const d = diff(level);
    const make = (dx) => {
      const big = Math.random() < d.big;
      puffs.push({
        x: clamp(bandit.x + dx, 20 * S, W - 20 * S), y: bandit.y + 72 * S,
        vx: rand(-1, 1) * d.drift * S, vy: d.speed * S * rand(0.9, 1.12) * (big ? 0.8 : 1),
        r: (big ? rand(28, 34) : rand(15, 21)) * S, t: 0, ph: rand(0, 6), hit: false,
        zig: Math.random() < d.zigzag ? rand(70, 130) * S : 0
      });
    };
    make(0);
    const side = Math.random() < 0.5 ? -1 : 1;
    if (Math.random() < d.triple) { make(rand(75, 120) * S * side); make(-rand(75, 120) * S * side); }
    else if (Math.random() < d.double) make(rand(70, 140) * S * side);
    bandit.squish = 1;
    addPop(bandit.x + rand(-14, 14) * S, bandit.y + 66 * S, '뿡!', '#a46bd8', 22);
    addSparks(bandit.x, bandit.y + 70 * S, 6, ['#e9fbe2', '#d4f2c8', '#ffffff']);
  }

  // ---------- 업데이트 ----------
  function update(dt, t) {
    for (const c of deco) { c.x += c.v * dt; if (c.x > W + 30) { c.x = -100 * S; c.y = rand(H * 0.25, H * 0.7); } }

    // 창현 이동
    bandit.timer -= dt;
    if (bandit.timer <= 0) {
      bandit.tx = rand(55 * S, W - 55 * S);
      bandit.timer = state === 'play' ? rand(0.5, 1.4) * Math.max(0.35, 1 - (level - 1) * 0.08) : rand(1, 2);
    }
    const prevX = bandit.x;
    bandit.x += (bandit.tx - bandit.x) * Math.min(1, dt * diff(level).move);
    bandit.vx = (bandit.x - prevX) / Math.max(dt, 1e-3);
    bandit.squish = Math.max(0, bandit.squish - dt * 3);

    // 진경 이동
    const L = keys.left || held.left.size > 0, R = keys.right || held.right.size > 0;
    player.dir = state === 'play' ? (L && !R ? -1 : R && !L ? 1 : 0) : 0;
    player.x = clamp(player.x + player.dir * 340 * S * dt, 24 * S, W - 24 * S);

    if (state === 'play') {
      elapsed += dt;
      const nl = 1 + Math.floor(elapsed / LEVEL_SEC);
      if (nl > level) {
        level = nl;
        banner = { t: 0, text: '레벨 UP! Lv.' + level };
        $level.classList.remove('up'); void $level.offsetWidth; $level.classList.add('up');
      }
      invuln = Math.max(0, invuln - dt);
      spawnT -= dt;
      if (spawnT <= 0) { fart(); spawnT = diff(level).interval * rand(0.85, 1.15); }
    }
    if (banner) { banner.t += dt; if (banner.t > 1.6) banner = null; }

    // 방구 이동 + 충돌
    const gy = groundTop();
    const hb = { l: player.x - 15 * S, r: player.x + 15 * S, t: player.y - 100 * S, b: player.y - 4 * S };
    for (const p of puffs) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.zig) p.x += Math.cos(p.t * 4 + p.ph) * p.zig * dt;
      if (p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx); }
      if (p.x > W - p.r) { p.x = W - p.r; p.vx = -Math.abs(p.vx); }
      if (state !== 'play' || p.hit) continue;
      const cx = clamp(p.x, hb.l, hb.r), cy = clamp(p.y, hb.t, hb.b);
      if (invuln <= 0 && Math.hypot(p.x - cx, p.y - cy) < p.r * 0.78) {
        p.hit = true; lives--; invuln = 1.3; shake = 0.25;
        addPop(player.x, player.y - 118 * S, '앗!', '#ff4d6d', 26);
        addSparks(p.x, p.y, 12, ['#d4f2c8', '#ffffff', '#b6e8a8']);
        if (lives <= 0) { lives = 0; updateHud(); gameOver(); }
      } else if (p.y - p.r * 0.3 > gy) {
        p.hit = true; score++;
        addPop(p.x, gy - 12 * S, '+1', '#ff5c9a', 20);
        addSparks(p.x, gy, 6, ['#ffffff', '#e3f8d8']);
      }
    }
    puffs = puffs.filter(p => !p.hit && p.y < H + 60);

    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * S * dt; }
    sparks = sparks.filter(s => s.t < s.life);
    for (const p of pops) { p.t += dt; p.y -= 30 * S * dt; }
    pops = pops.filter(p => p.t < p.life);
    shake = Math.max(0, shake - dt);

    if (state === 'play') updateHud();
  }

  // ---------- 렌더 ----------
  function render(t) {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-5, 5) * S, rand(-5, 5) * S);
    drawBackground(t);
    drawBandit(bandit, t);
    for (const p of puffs) drawPuff(p);
    drawGirl(player, t);
    drawLabel('창현', bandit.x, bandit.y + 96 * S, '#c0392b');
    drawLabel('진경', player.x, player.y + 14 * S, '#ff3d8b');
    for (const s of sparks) {
      ctx.globalAlpha = 1 - s.t / s.life;
      el(s.x, s.y, s.r, s.r, s.c);
    }
    ctx.globalAlpha = 1;
    if (banner) {
      const k = banner.t / 1.6;
      const sc = k < 0.15 ? 0.5 + k / 0.15 * 0.6 : 1.1 - Math.min(0.1, k - 0.15);
      ctx.save();
      ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      ctx.translate(W / 2, H * 0.45); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.font = `${Math.round(34 * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.lineWidth = 7 * S; ctx.strokeStyle = '#fff'; ctx.strokeText(banner.text, 0, 0);
      ctx.fillStyle = '#ff8a3d'; ctx.fillText(banner.text, 0, 0);
      ctx.font = `${Math.round(18 * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.lineWidth = 5 * S; ctx.strokeText('방구가 더 거세져요!', 0, 32 * S);
      ctx.fillStyle = '#a46bd8'; ctx.fillText('방구가 더 거세져요!', 0, 32 * S);
      ctx.restore();
    }
    for (const p of pops) {
      const k = p.t / p.life;
      const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
      ctx.save();
      ctx.globalAlpha = 1 - Math.max(0, (k - 0.6) / 0.4);
      ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      ctx.font = `${Math.round(p.size * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4 * S; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    update(dt, t);
    render(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  initDeco();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
